<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Senza connessione</title>
<style>
    :root { color-scheme: light dark; }
    body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f2f4f7;
        color: #1f2328;
    }
    .mark {
        width: 76px; height: 76px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 22px;
        background: {{ accent }}; color: #fff;
        font-size: 38px;
    }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; max-width: 34ch; color: #667079; }
    button {
        margin-top: 6px;
        min-height: 46px;
        padding: 0 22px;
        border: 0;
        border-radius: 10px;
        background: {{ accent }};
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #1b1f24; color: #e9edf1; }
        p { color: #9aa5b1; }
    }
</style>
</head>
<body>
    <div class="mark" aria-hidden="true">📴</div>
    <h1>Sei senza connessione</h1>
    <p>{{ name }} ha bisogno della rete per mostrarti dati aggiornati. Riprova appena torni online.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
</body>
</html>
