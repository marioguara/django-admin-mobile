[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-admin-mobile"
version = "0.3.1"
description = "L'admin di Django come una normale app per telefono: barra in alto, barra di navigazione in basso, menu laterale, elenchi a schede."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "django-admin-mobile contributors" },
]
keywords = ["django", "admin", "mobile", "responsive", "pwa", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-django>=4",
    "coverage[toml]>=7",
]

[project.urls]
Homepage = "https://github.com/marioguara/django-admin-mobile"
Repository = "https://github.com/marioguara/django-admin-mobile"
Issues = "https://github.com/marioguara/django-admin-mobile/issues"
Changelog = "https://github.com/marioguara/django-admin-mobile/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["django_admin_mobile*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
django_admin_mobile = [
    "templates/**/*.html",
    "static/**/*",
    "migrations/*.py",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["django_admin_mobile"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
